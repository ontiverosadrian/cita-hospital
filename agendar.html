<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Centro Médico Vitalia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Navegación -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center max-w-6xl">
            <a href="index.html" class="flex items-center space-x-2">
                <span class="text-3xl">🏥</span>
                <span class="text-xl font-bold text-teal-700 tracking-tight">Centro Médico Vitalia</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-teal-700 transition">← Volver al Inicio</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container mx-auto px-6 py-12 max-w-2xl">
        <div class="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-gray-100">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800">Agendar una Cita Médica</h1>
                <p class="text-gray-500 mt-2 text-sm">Completa el formulario para reservar tu espacio con nuestros especialistas.</p>
            </div>

            <div id="mensaje-alerta" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

            <form id="form-cita" onsubmit="agendarCita(event)" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Nombre Completo</label>
                        <input type="text" id="nombrePaciente" required placeholder="Ej. María Pérez" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Teléfono de Contacto</label>
                        <input type="tel" id="telefono" required placeholder="Ej. 5512345678" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Correo Electrónico</label>
                    <input type="email" id="correo" required placeholder="correo@ejemplo.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Especialidad</label>
                        <select id="especialidad" onchange="actualizarDoctores()" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm bg-white">
                            <option value="">Seleccione una especialidad</option>
                            <option value="Medicina General">Medicina General</option>
                            <option value="Cardiología">Cardiología</option>
                            <option value="Pediatría">Pediatría</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Médico Especialista</label>
                        <select id="doctor" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm bg-white">
                            <option value="">Primero seleccione especialidad</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Fecha de la Cita</label>
                        <input type="date" id="fecha" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Hora Preferida</label>
                        <select id="hora" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm bg-white">
                            <option value="">Seleccione un horario</option>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Motivo de la Consulta (Opcional)</label>
                    <textarea id="motivo" rows="3" placeholder="Describa brevemente sus síntomas o motivo..." class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm"></textarea>
                </div>

                <button type="submit" class="w-full bg-teal-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-teal-700 transition">
                    Confirmar Cita Médica
                </button>
            </form>
        </div>
    </main>

    <script>
        const doctoresPorEspecialidad = {
            "Medicina General": ["Dra. Elena Ríos"],
            "Cardiología": ["Dr. Carlos Sánchez"],
            "Pediatría": ["Dr. Ana Torres"]
        };

        function actualizarDoctores() {
            const especialidadSelect = document.getElementById('especialidad').value;
            const doctorSelect = document.getElementById('doctor');
            
            doctorSelect.innerHTML = '<option value="">Seleccione un médico</option>';
            
            if (doctoresPorEspecialidad[especialidadSelect]) {
                doctoresPorEspecialidad[especialidadSelect].forEach(doc => {
                    const option = document.createElement('option');
                    option.value = doc;
                    option.textContent = doc;
                    doctorSelect.appendChild(option);
                });
            }
        }

        async function agendarCita(event) {
            event.preventDefault();
            const alerta = document.getElementById('mensaje-alerta');

            const datosCita = {
                nombrePaciente: document.getElementById('nombrePaciente').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                especialidad: document.getElementById('especialidad').value,
                doctor: document.getElementById('doctor').value,
                fecha: document.getElementById('fecha').value,
                hora: document.getElementById('hora').value,
                motivo: document.getElementById('motivo').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/citas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosCita)
                });

                const resultado = await response.json();

                if (response.ok) {
                    alerta.className = "mb-6 p-4 rounded-xl text-sm font-medium bg-green-50 text-green-700 border border-green-200";
                    alerta.innerText = "¡Cita agendada con éxito! Te esperamos en Centro Médico Vitalia.";
                    alerta.classList.remove('hidden');
                    document.getElementById('form-cita').reset();
                } else {
                    alerta.className = "mb-6 p-4 rounded-xl text-sm font-medium bg-red-50 text-red-700 border border-red-200";
                    alerta.innerText = resultado.error || "Ocurrió un error al agendar.";
                    alerta.classList.remove('hidden');
                }
            } catch (error) {
                alerta.className = "mb-6 p-4 rounded-xl text-sm font-medium bg-red-50 text-red-700 border border-red-200";
                alerta.innerText = "Error de conexión con el servidor.";
                alerta.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
